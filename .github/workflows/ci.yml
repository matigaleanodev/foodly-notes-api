name: CI - Foodly Backend

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --ci --coverage

      - name: Run e2e tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: npm run test:e2e

      - name: Build project
        run: npm run build

      - name: Generate OpenAPI and Postman collection
        run: npm run generate:postman

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

      - name: Upload Postman collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-collection
          path: postman-collection.json
