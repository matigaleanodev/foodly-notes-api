name: CI - Foodly Backend

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --ci --coverage

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Run MongoDB integration tests
        env:
          INTEGRATION_MONGO_URI: mongodb://127.0.0.1:27017/foodly_notes_ci
        run: npm run test:integration

      - name: Build project
        run: npm run build

      - name: Generate OpenAPI and Postman collection
        run: npm run generate:postman

      - name: Verify Postman export
        run: npm run test:postman

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: openapi.json

      - name: Upload Postman collection artifact
        uses: actions/upload-artifact@v7
        with:
          name: postman-collection
          path: postman-collection.json
